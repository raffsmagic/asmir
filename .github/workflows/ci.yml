name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container: archlinux:latest
    env:
      # Where asmir looks for its models.
      XDG_DATA_HOME: /tmp/asmir-data
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel git cmake qt6-base qt6-declarative layer-shell-qt libpipewire

      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Build
        run: bin/build

      # The default model (32 MB) makes the real-transcription test run too.
      - name: Cache the speech model
        uses: actions/cache@v4
        with:
          path: /tmp/asmir-data/asmir/models
          key: model-tiny.en-q5_1-c77c5766

      - name: Download the speech model
        run: |
          [ -f /tmp/asmir-data/asmir/models/ggml-tiny.en-q5_1.bin ] || build/app/asmir model download tiny.en-q5_1

      - name: Test
        run: |
          bin/test
          bin/test transcribesTheSample | grep -q '^PASS.*transcribesTheSample'

